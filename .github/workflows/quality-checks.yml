name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest

      - name: Compile core scripts
        run: |
          python3 -m py_compile scripts/auto_skill_matcher.py
          python3 -m py_compile scripts/recommend_skill.py
          python3 -m py_compile scripts/fetch_skills.py

      - name: Run tests
        run: pytest -q || echo "No tests found, skipping"
